name: Upgrade hero resolution

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/upgrade-hero-resolution.yml"

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ImageMagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      - name: Upscale heroes to 1200x720
        run: |
          set -e
          for theme in dark light; do
            convert "assets/hero-$theme.png"               -filter Lanczos               -resize 1200x720!               -unsharp 0x0.5+0.4+0.02               -strip               -define png:compression-level=9               "assets/hero-$theme.tmp.png"
            mv "assets/hero-$theme.tmp.png" "assets/hero-$theme.png"
          done

      - name: Verify dimensions
        run: |
          set -e
          identify assets/hero-dark.png
          identify assets/hero-light.png
          test "$(identify -format '%wx%h' assets/hero-dark.png)" = "1200x720"
          test "$(identify -format '%wx%h' assets/hero-light.png)" = "1200x720"

      - name: Commit upgraded PNG heroes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero-dark.png assets/hero-light.png
          git diff --cached --quiet && exit 0
          git commit -m "fix: upgrade hero assets to 1200x720"
          git push
