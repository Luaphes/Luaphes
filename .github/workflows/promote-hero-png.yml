name: Promote final hero assets to PNG

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/promote-hero-png.yml"

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert final WebP heroes to PNG
        run: |
          python - <<'PY'
          from PIL import Image
          for theme in ("dark", "light"):
              src = f"assets/hero-{theme}.webp"
              dst = f"assets/hero-{theme}.png"
              with Image.open(src) as im:
                  im.save(dst, "PNG", optimize=True)
          PY
      - name: Point README back to PNG
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("README.md")
          s = p.read_text()
          s = s.replace("./assets/hero-dark.webp", "./assets/hero-dark.png")
          s = s.replace("./assets/hero-light.webp", "./assets/hero-light.png")
          p.write_text(s)
          PY
      - name: Commit PNG hero replacement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/hero-dark.png assets/hero-light.png
          git diff --cached --quiet && exit 0
          git commit -m "feat: replace final light and dark hero PNG assets"
          git push
