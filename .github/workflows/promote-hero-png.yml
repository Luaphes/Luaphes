name: Promote final hero assets to PNG

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/promote-hero-png.yml"

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert final WebP heroes to PNG
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          convert assets/hero-dark.webp assets/hero-dark.png
          convert assets/hero-light.webp assets/hero-light.png
      - name: Point README back to PNG
        run: |
          sed -i 's#./assets/hero-dark.webp#./assets/hero-dark.png#g' README.md
          sed -i 's#./assets/hero-light.webp#./assets/hero-light.png#g' README.md
      - name: Commit PNG hero replacement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/hero-dark.png assets/hero-light.png
          git diff --cached --quiet && exit 0
          git commit -m "feat: replace final light and dark hero PNG assets"
          git push
