<svg width="960" height="180" viewBox="0 0 960 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1421"/>
      <stop offset="1" stop-color="#121022"/>
    </linearGradient>

    <linearGradient id="scratch1" x1="790" y1="118" x2="842" y2="46" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20D7FF" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#7A5CFF" stop-opacity="0.92"/>
    </linearGradient>

    <linearGradient id="scratch2" x1="815" y1="122" x2="870" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#53B8FF" stop-opacity="0.68"/>
      <stop offset="1" stop-color="#B06BFF" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="scratch3" x1="842" y1="120" x2="900" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7A5CFF" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#FF62C7" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="958" height="178" rx="18" fill="url(#bg)" stroke="#2A3445"/>

  <text x="62" y="76"
        font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="28"
        font-style="italic"
        font-weight="600"
        fill="#F2F5FA">Leave some scratches.</text>

  <text x="62" y="114"
        font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"
        font-size="20"
        fill="#B8C2D3">想在这个世界上，留下一些自己的爪痕。</text>

  <!-- claw marks: irregular, subtle, and intentionally imperfect -->
  <g fill="none" stroke-linecap="round" filter="url(#glow)">
    <path d="M794 117 C806 97, 819 76, 834 48"
          stroke="url(#scratch1)" stroke-width="3.4"/>
    <path d="M823 122 C836 100, 850 76, 866 43"
          stroke="url(#scratch2)" stroke-width="3.9"/>
    <path d="M850 118 C863 98, 877 76, 892 50"
          stroke="url(#scratch3)" stroke-width="3.2"/>
  </g>
</svg>
